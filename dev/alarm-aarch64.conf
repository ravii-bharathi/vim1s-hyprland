# pacman config used ONLY by scripts/validate.sh to resolve package names + dependencies
# against the live Arch Linux ARM aarch64 repos from an x86_64 machine. It never installs:
# validate.sh only runs `pacman -Sp` (print targets) and `pacman -Si` (info) with it.
#
# SigLevel = Never because the ALARM databases are fetched with plain curl into a temp dir
# and nothing is ever installed from them; never copy this into a real system.

[options]
Architecture = aarch64
SigLevel = Never

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo
