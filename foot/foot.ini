# vim1s-desktop :: foot 1.27 (CPU/pixman renderer — no GPU work for the terminal itself)
#
# vim1s-shell starts `foot --server`; windows are opened with `footclient`, so all terminals
# share one process and one glyph cache (less RAM on a 2 GB board).
# Only long-stable keys are used here; dev/validate.sh runs foot's own config checker on it.

[main]
font=monospace:size=10
pad=4x4

[scrollback]
lines=2000
